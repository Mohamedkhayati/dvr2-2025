server:
  port: 8080

spring:
  profiles:
    active: default
  config:
    import: "optional:configserver:http://localhost:9999,optional:classpath:application-local.yml"
  application:
    name: supplement
  datasource:
    url: "jdbc:h2:mem:suppdb"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: true
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
    discovery:
      enabled: true
  eureka:
    client:
      service-url:
        defaultZone: "http://localhost:8761/eureka/"

management:
  endpoints:
    web:
      exposure:
        include: '*'

eureka:
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework: DEBUG
    com.med.supplement: DEBUG