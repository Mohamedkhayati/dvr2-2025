spring:
  application:
    name: supplement

  profiles:
    active: prod

  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}

#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest

  datasource:
    url: jdbc:h2:mem:suppdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  cloud:
    config:
      enabled: true
      fail-fast: false
    discovery:
      enabled: true
    bus:
      enabled: true
      refresh:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    hostname: localhost
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    busrefresh:
      enabled: true

server:
  port: 8080

build:
  version: 1.0


